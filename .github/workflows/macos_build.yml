name: MacOS Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - .github/**
      - "!.github/workflows/macos_build.yml"
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - "!.github/workflows/macos_build.yml"
      - "**.md"
      - "docs/**"

env:
  BATCH_MKV_MERGE_VERSION: 1.0.0

jobs:
  build_package:
    strategy:
      matrix:
        include:
          - image: macos-15-intel
            os: macos
            arch: x86_64
          - image: macos-15
            os: macos
            arch: arm64

    name: Build for ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.image }}

    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout the code
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      # No `toolchain:` input: the action then installs the toolchain pinned in
      # rust-toolchain.toml. Passing `toolchain: stable` would also run
      # `rustup override set stable` on the repository root, which outranks the
      # pin now that rust-toolchain.toml lives there.
      with:
        # The action sets RUSTFLAGS=-D warnings by default, which turns every
        # rustc warning into a CI failure. Clearing the flag lets warnings stay
        # warnings; CI fails on errors and failing checks only.
        rustflags: ""

    - name: Run Rust tests
      run: cargo test --release --workspace --locked

    - name: Install cargo-packager
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-packager@0.11.8

    # Installers come from the dist profile: release + thin LTO, one codegen
    # unit, stripped symbols.
    - name: Build BatchMkvMerge (dist profile)
      run: cargo build --profile dist -p BatchMkvMerge --locked

    - name: Package the app and the dmg
      run: cargo packager --profile dist -p BatchMkvMerge -f app,dmg

    - name: Upload the Artifact
      uses: actions/upload-artifact@v7
      with:
        name: BatchMkvMerge-${{ matrix.os }}-${{ matrix.arch }}-${{ env.BATCH_MKV_MERGE_VERSION }}
        path: |
          target/packager/*.dmg
