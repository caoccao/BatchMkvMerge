name: Windows Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - .github/**
      - "!.github/workflows/windows_build.yml"
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - "!.github/workflows/windows_build.yml"
      - "**.md"
      - "docs/**"

env:
  BATCH_MKV_MERGE_VERSION: 0.2.0

jobs:
  build_package:
    name: Build for Windows x86_64
    runs-on: windows-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      # No `toolchain:` input: the action then installs the toolchain pinned in
      # rust-toolchain.toml. Passing `toolchain: stable` would also run
      # `rustup override set stable` on the repository root, which outranks the
      # pin now that rust-toolchain.toml lives there.
      with:
        # The action sets RUSTFLAGS=-D warnings by default, which turns every
        # rustc warning into a CI failure. Phased delivery of the
        # media_metadata parser intentionally lands public fns before their
        # consumers (next phase fills them in), so transient "never used"
        # warnings are expected. Clearing the flag lets warnings stay warnings.
        rustflags: ""

    - name: Run Rust tests
      run: cargo test --release --workspace --locked

    - name: Install cargo-packager
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-packager@0.11.8

    # Installers come from the dist profile: release + thin LTO, one codegen
    # unit, stripped symbols.
    - name: Build BatchMkvMerge (dist profile)
      run: cargo build --profile dist -p BatchMkvMerge --locked

    # cargo-packager downloads WiX 3 and NSIS itself. One MSI per language,
    # as 0.1.0 shipped.
    - name: Package the msi and the NSIS installer
      run: cargo packager --profile dist -p BatchMkvMerge -f nsis,wix

    - name: Upload the msi
      uses: actions/upload-artifact@v7
      with:
        name: BatchMkvMerge-windows-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-msi
        path: |
          target/packager/*.msi

    - name: Upload the nsis
      uses: actions/upload-artifact@v7
      with:
        name: BatchMkvMerge-windows-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-nsis
        path: |
          target/packager/*-setup.exe
