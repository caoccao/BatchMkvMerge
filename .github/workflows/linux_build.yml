name: Linux Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - .github/**
      - "!.github/workflows/linux_build.yml"
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - "!.github/workflows/linux_build.yml"
      - "**.md"
      - "docs/**"

env:
  BATCH_MKV_MERGE_VERSION: 0.2.0

jobs:
  build_package:
    name: Build for Linux x86_64
    # 22.04 keeps the glibc floor of the binary low.
    runs-on: ubuntu-22.04

    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout the code
      uses: actions/checkout@v6

    - name: Install system packages
      # Build dependencies of GPUI (gpui-kit's install script) plus Mesa's
      # Vulkan drivers for the headless UI tests, and the tools cargo-packager
      # needs for the AppImage.
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ clang pkg-config libzstd-dev libfontconfig-dev libfreetype-dev \
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libssl-dev \
          libvulkan-dev libvulkan1 mesa-vulkan-drivers patchelf squashfs-tools file

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      # No `toolchain:` input: the action then installs the toolchain pinned in
      # rust-toolchain.toml. Passing `toolchain: stable` would also run
      # `rustup override set stable` on the repository root, which outranks the
      # pin now that rust-toolchain.toml lives there.
      with:
        # llvm-tools-preview is needed by cargo-llvm-cov for the coverage gate;
        # it is added to the pinned toolchain.
        components: llvm-tools-preview
        # The action sets RUSTFLAGS=-D warnings by default, which turns every
        # rustc warning into a CI failure. Phased delivery of the
        # media_metadata parser intentionally lands public fns before their
        # consumers (next phase fills them in), so transient "never used"
        # warnings are expected. Clearing the flag lets warnings stay warnings.
        rustflags: ""

    - name: Run Rust tests
      run: cargo test --release --workspace --locked

    # Coverage gate: the UI-free bmm-core crate (parser, config, merge queue,
    # services, MKVToolNix, update check) is held to >= 90% line coverage.
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Coverage gate (bmm-core >= 90%)
      run: cargo llvm-cov --release -p bmm-core --summary-only --fail-under-lines 90

    - name: Install packaging tools
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-packager@0.11.8,cargo-generate-rpm@0.21.1

    # Installers come from the dist profile: release + thin LTO, one codegen
    # unit, stripped symbols.
    - name: Build BatchMkvMerge (dist profile)
      run: cargo build --profile dist -p BatchMkvMerge --locked

    - name: Package the deb and the AppImage
      run: cargo packager --profile dist -p BatchMkvMerge -f deb,appimage

    - name: Package the rpm
      run: cargo generate-rpm --profile dist -p crates/bmm-app

    - name: Upload the deb
      uses: actions/upload-artifact@v7
      with:
        name: BatchMkvMerge-linux-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-deb
        path: |
          target/packager/*.deb

    - name: Upload the rpm
      uses: actions/upload-artifact@v7
      with:
        name: BatchMkvMerge-linux-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-rpm
        path: |
          target/generate-rpm/*.rpm

    - name: Upload the AppImage
      uses: actions/upload-artifact@v7
      with:
        name: BatchMkvMerge-linux-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-AppImage
        path: |
          target/packager/*.AppImage
