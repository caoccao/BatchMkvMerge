name: Linux Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - .github/**
      - "!.github/workflows/linux_build.yml"
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - "!.github/workflows/linux_build.yml"
      - "**.md"
      - "docs/**"

# Every job only reads the repository; artifacts upload with the runner's
# own token.
permissions:
  contents: read

env:
  BATCH_MKV_MERGE_VERSION: 1.0.0

jobs:
  build_package:
    name: Build for Linux x86_64
    # 22.04 keeps the glibc floor of the binary low.
    runs-on: ubuntu-22.04

    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install system packages
      # Build dependencies of GPUI (gpui-kit's install script) plus Mesa's
      # Vulkan drivers for the headless UI tests, and the tools cargo-packager
      # needs for the AppImage.
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ clang pkg-config libzstd-dev libfontconfig-dev libfreetype-dev \
          libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libssl-dev \
          libvulkan-dev libvulkan1 mesa-vulkan-drivers patchelf squashfs-tools file

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # No `toolchain:` input: the action then installs the toolchain pinned in
      # rust-toolchain.toml. Passing `toolchain: stable` would also run
      # `rustup override set stable` on the repository root, which outranks the
      # pin now that rust-toolchain.toml lives there.
      with:
        # llvm-tools-preview is needed by cargo-llvm-cov for the coverage gate;
        # it is added to the pinned toolchain.
        components: llvm-tools-preview
        # The action sets RUSTFLAGS=-D warnings by default, which turns every
        # rustc warning into a CI failure. Clearing the flag lets warnings stay
        # warnings; CI fails on errors and failing checks only.
        rustflags: ""

    # bmm-core's tests run once, under the coverage gate below.
    - name: Run Rust tests
      run: cargo test --release --workspace --locked --exclude bmm-core

    # Coverage gate: the UI-free bmm-core crate (parser, config, merge queue,
    # services, MKVToolNix, update check) is held to >= 90% line coverage.
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-llvm-cov

    - name: Test bmm-core with the coverage gate (>= 90%)
      run: cargo llvm-cov --release -p bmm-core --locked --summary-only --fail-under-lines 90

    - name: Install packaging tools
      uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
      with:
        tool: cargo-packager@0.11.8,cargo-generate-rpm@0.21.1

    # Installers come from the dist profile: release + thin LTO, one codegen
    # unit, stripped symbols.
    - name: Build BatchMkvMerge (dist profile)
      run: cargo build --profile dist -p BatchMkvMerge --locked

    - name: Package the deb and the AppImage
      run: cargo packager --profile dist -p BatchMkvMerge -f deb,appimage

    - name: Package the rpm
      run: cargo generate-rpm --profile dist -p crates/bmm-app

    - name: Upload the deb
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: BatchMkvMerge-linux-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-deb
        path: |
          target/packager/*.deb

    - name: Upload the rpm
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: BatchMkvMerge-linux-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-rpm
        path: |
          target/generate-rpm/*.rpm

    - name: Upload the AppImage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: BatchMkvMerge-linux-x86_64-${{ env.BATCH_MKV_MERGE_VERSION }}-AppImage
        path: |
          target/packager/*.AppImage

  lint:
    name: Lint (reports only)
    runs-on: ubuntu-22.04
    # The parser carries a few hundred clippy findings, and rustflags stay
    # empty so warnings do not fail the build; this job shows new ones on
    # every run without blocking it.
    continue-on-error: true

    steps:
    - name: Checkout the code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      # The pinned toolchain from rust-toolchain.toml, with clippy and rustfmt.
      with:
        rustflags: ""

    - name: Check formatting
      run: cargo fmt --all --check

    # bmm-core needs none of GPUI's system packages to build.
    - name: Clippy (bmm-core)
      run: cargo clippy --release -p bmm-core --all-targets --locked
