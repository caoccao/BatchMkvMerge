[package]
name = "BatchMkvMerge"
version = "0.2.0"
description = "A tool to batch merge media files to MKV files using mkvmerge."
authors = ["Sam Cao"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "batch_mkvmerge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bmm-core = { path = "../crates/bmm-core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
serde.workspace = true
anyhow.workspace = true
log.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7.3"
windows-registry = "0.6.1"

# Only `tests/protocol_typescript.rs` uses specta directly; the model derives
# live in `bmm-core`.
[dev-dependencies]
specta.workspace = true
specta-serde.workspace = true
specta-typescript.workspace = true
